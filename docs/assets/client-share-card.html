<!doctype html>
<html lang="ko">
  <meta charset="UTF-8" />
  <title>in2white 공유 이미지 원본</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      color: #171719;
      background: #f7f7f8;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    main {
      position: relative;
      height: 100%;
      padding: 62px 72px;
    }
    .brand {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }
    h1 {
      margin: 88px 0 20px;
      font-size: 60px;
      line-height: 1.22;
      letter-spacing: -2.8px;
    }
    p {
      margin: 0;
      font-size: 23px;
      color: #626268;
      letter-spacing: -0.6px;
    }
    .logo {
      position: absolute;
      width: 440px;
      height: 440px;
      right: 42px;
      top: 107px;
    }
    footer {
      position: absolute;
      bottom: 50px;
      left: 72px;
      right: 72px;
      border-top: 1px solid #dedee2;
      padding-top: 22px;
      font-size: 16px;
      color: #78787f;
      letter-spacing: 0.4px;
    }
  </style>
  <main>
    <div class="brand">in2white</div>
    <h1>아이디어를 펼치고,<br />팀과 함께 그려요.</h1>
    <p>팀을 위한 실시간 협업 화이트보드</p>
    <img class="logo" src="../../logo.png" alt="in2white 로고" />
    <footer>하나의 캔버스에서 시작하는 우리 팀의 다음 아이디어</footer>
  </main>
</html>
