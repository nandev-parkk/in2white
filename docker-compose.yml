services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL을 설정하세요}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  # 어드민 콘솔은 기본적으로 127.0.0.1에만 묶어 둔다. 서비스 전체를 조작하는 화면이므로
  # 외부에 열 때는 리버스 프록시에서 인증·IP 제한을 앞단에 둔다.
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_VITE_API_BASE_URL:?ADMIN_VITE_API_BASE_URL을 설정하세요}
        VITE_ENVIRONMENT_LABEL: ${ADMIN_ENVIRONMENT_LABEL:-production}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 설정하세요}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL을 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 설정하세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET을 설정하세요}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET을 설정하세요}
      JWT_ADMIN_REFRESH_SECRET: ${JWT_ADMIN_REFRESH_SECRET:?JWT_ADMIN_REFRESH_SECRET을 설정하세요}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN을 설정하세요}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:?ADMIN_CORS_ORIGIN을 설정하세요}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
