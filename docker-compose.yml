services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL을 설정하세요}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 설정하세요}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL을 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 설정하세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET을 설정하세요}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET을 설정하세요}
      JWT_ADMIN_REFRESH_SECRET: ${JWT_ADMIN_REFRESH_SECRET:?JWT_ADMIN_REFRESH_SECRET을 설정하세요}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN을 설정하세요}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:?ADMIN_CORS_ORIGIN을 설정하세요}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
